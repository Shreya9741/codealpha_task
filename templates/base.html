{% load static %}<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>{% block title %}Connecta{% endblock %}</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head>
<body><header class="navbar"><div class="brand-wrap"><div class="brand-mark">C</div><a class="brand" href="{% url 'feed' %}">Connecta</a></div>{% if user.is_authenticated %}<nav><a href="{% url 'feed' %}">Home</a><a href="{% url 'profile' user.username %}">Profile</a><a href="{% url 'logout' %}">Logout</a></nav>{% endif %}</header><main class="container">{% for message in messages %}<div class="message">{{message}}</div>{% endfor %}{% block content %}{% endblock %}</main><script src="{% static 'js/app.js' %}"></script></body></html>
